model:
  base_model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  ell_star: 20
  num_recurrent_steps: 4
  beta: 0.5
  lora_rank: 32
  lora_alpha: 16
  lora_dropout: 0.01
  per_example_answer_loss: true

data:
  path: /path/to/visual_cot_arrow
  train_split: train
  validation_split: validation
  max_visual_tokens: 8192

training:
  output_dir: outputs/cvrr-qwen2.5-vl-7b
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 1
  optim: adamw_torch
  learning_rate: 2.0e-5
  num_train_epochs: 3
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  bf16: true
  tf32: true
  dataloader_num_workers: 8
  dataloader_drop_last: true
  ddp_find_unused_parameters: false
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 3
  logging_steps: 5
  report_to: none
  seed: 0
